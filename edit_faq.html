{% extends "base.html" %}
{% block title %}SweetTalk - Edit FAQ{% endblock %}

{% block content %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <div class="container mt-4">
        <h2>Edit FAQ</h2>
        <form method="POST">
            <!-- Question Field -->
            <div class="mb-3">
                <label for="question" class="form-label">Question</label>
                <input type="text" class="form-control" id="question" name="question" value="{{ faq['question'] }}" required>
            </div>
            
            <!-- Description Field -->
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="4" required>{{ faq['description'] }}</textarea>
            </div>

            <!-- Hidden Input for Email (for verification) -->
            <input type="hidden" name="email" value="staff@gmail.com">
            
            <!-- Submit and Cancel Buttons -->
            <button type="submit" class="btn btn-primary">Update FAQ</button>
            <a href="{{ url_for('faq') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
